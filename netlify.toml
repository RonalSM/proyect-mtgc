[build]
  command = "npm run build:web"
  publish = "apps/web/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob: https://cards.scryfall.io https://*.scryfall.io https://svgs.scryfall.io; connect-src 'self' https://mtgc-backend-caf950eaa8b4.herokuapp.com wss://mtgc-backend-caf950eaa8b4.herokuapp.com https://api.scryfall.com https://*.scryfall.com https://cards.scryfall.io https://*.scryfall.io ws: wss:;"
